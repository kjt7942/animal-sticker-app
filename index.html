<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffe8f0">
<title>동물 스티커 도감</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Gaegu', sans-serif;
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px 16px 40px;
    background: linear-gradient(160deg, #ffe8f0 0%, #e5f0ff 50%, #fff6d9 100%);
    background-attachment: fixed;
    color: #5b4636;
    overflow-x: hidden;
  }
  body.modal-open { overflow: hidden; }
  h1 {
    font-family: 'Jua', sans-serif;
    text-align: center;
    font-size: 24px;
    color: #ff6f91;
    text-shadow: 1px 2px 0 #fff;
    margin: 8px 0 2px;
  }
  .subtitle { text-align: center; color: #a08b7a; font-size: 14px; margin: 0 0 12px; }

  /* ---------- 촬영 카드 ---------- */
  .camera-card {
    background: #fffdf8;
    border: 3px dashed #ffc6d9;
    border-radius: 24px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 6px 0 #ffd6e4;
  }
  #status { color: #ff8fab; font-size: 14px; font-family: 'Jua', sans-serif; margin: 0 0 8px; min-height: 18px; }

  #progressWrap {
    width: 100%; height: 8px; background: #ffe3ec; border-radius: 999px;
    overflow: hidden; margin: -2px 0 10px;
  }
  #progressBar {
    height: 100%; width: 0%; background: linear-gradient(90deg, #ff9eb9, #ff6f91);
    border-radius: 999px; transition: width .15s ease;
  }
  #progressBar.indeterminate { width: 40% !important; animation: indeterminate 1.1s ease-in-out infinite; }
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  .shutter-label {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px;
    background: linear-gradient(180deg, #ffb3c6, #ff7fa6);
    color: white; font-family: 'Jua', sans-serif; font-size: 17px;
    padding: 0 28px; border-radius: 999px;
    box-shadow: 0 5px 0 #e1517e; cursor: pointer; user-select: none;
    transition: transform .08s;
  }
  .shutter-label:active { transform: translateY(4px); box-shadow: 0 1px 0 #e1517e; }
  input[type="file"] { display: none; }

  #pickBtn {
    display: block; margin: 10px auto 0; min-height: 32px;
    background: none; border: none; color: #a08b7a;
    font-family: 'Gaegu', sans-serif; font-size: 13px;
    text-decoration: underline; cursor: pointer;
  }

  #preview {
    display: block; width: 100%; max-height: 42vh; object-fit: contain;
    border-radius: 18px; margin-top: 12px;
    border: 4px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.08);
  }

  #result { margin-top: 10px; font-size: 20px; font-family: 'Jua', sans-serif; color: #6a4c93; }
  #result:empty { margin: 0; }
  #result .pill {
    display: inline-block; background: #fff2a8; color: #a67c00; border-radius: 999px;
    padding: 2px 12px; font-size: 13px; margin-left: 6px; font-family: 'Gaegu', sans-serif;
  }
  #result.pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

  .badge {
    display: inline-block; border-radius: 999px; padding: 2px 10px;
    font-family: 'Gaegu', sans-serif; font-size: 13px; vertical-align: middle;
  }
  .badge.new { background: #ffd7e6; color: #d1447a; animation: twinkle 1.2s ease-in-out infinite; }
  .badge.again { background: #e3f2e8; color: #5f9a76; }
  @keyframes twinkle { 0%,100%{opacity:1} 50%{opacity:.55} }

  #confirmArea { margin-top: 10px; }
  #altChips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .chip {
    display: inline-flex; align-items: center; min-height: 40px;
    background: #eef3ff; color: #5b74c9; border: none; border-radius: 999px;
    padding: 0 16px; font-family: 'Gaegu', sans-serif; font-size: 14px; cursor: pointer;
  }
  .chip.picked { background: #ffd7e6; color: #d1447a; }
  #nameInput {
    font-family: 'Jua', sans-serif; font-size: 16px; text-align: center; color: #6a4c93;
    border: 2px solid #ffd6e4; border-radius: 999px; padding: 10px 14px; width: 100%;
    min-height: 46px; background: #fff; margin-top: 10px;
  }
  #pickerBtn {
    display: inline-flex; align-items: center; justify-content: center;
    margin: 8px auto 0; min-height: 40px; padding: 0 18px; white-space: nowrap;
    border: none; border-radius: 999px; background: #eef3ff; color: #5b74c9;
    font-family: 'Gaegu', sans-serif; font-size: 14px; cursor: pointer;
  }

  .btn-pink, .btn-green, .btn-ghost {
    display: block; width: 100%; max-width: 260px; margin: 10px auto 0;
    min-height: 46px; border: none; border-radius: 999px; cursor: pointer;
    font-family: 'Jua', sans-serif; font-size: 15px; transition: transform .08s;
  }
  .btn-pink { background: linear-gradient(180deg, #ffb3c6, #ff7fa6); color: #fff; box-shadow: 0 4px 0 #e1517e; }
  .btn-pink:active { transform: translateY(3px); box-shadow: 0 1px 0 #e1517e; }
  .btn-green { background: linear-gradient(180deg, #b7e4c7, #7fc99a); color: #fff; box-shadow: 0 4px 0 #5aab77; }
  .btn-green:active { transform: translateY(3px); box-shadow: 0 1px 0 #5aab77; }
  .btn-ghost { background: #f4efe6; color: #8a7663; font-size: 14px; }
  .btn-ghost.danger { color: #c96b6b; }
  button:disabled { opacity: .6; }

  #toggleOriginal {
    display: block; margin: 8px auto 0; min-height: 36px;
    background: #eef3ff; color: #5b74c9; border: none; border-radius: 999px;
    padding: 0 16px; font-family: 'Gaegu', sans-serif; font-size: 13px; cursor: pointer;
  }
  #toggleOriginal.active { background: #ffd7e6; color: #d1447a; }

  #notFound { margin-top: 10px; }
  .nf-title { font-family: 'Jua', sans-serif; font-size: 17px; color: #6a4c93; margin: 4px 0; }
  .nf-hint { font-size: 14px; color: #a08b7a; margin: 0 0 6px; }

  /* ---------- 오늘의 발견 ---------- */
  .today-card {
    display: flex; flex-direction: column; gap: 2px;
    margin-top: 14px; padding: 12px 16px; border-radius: 18px;
    background: #fffdf8; box-shadow: 0 4px 0 #f0e6d2;
  }
  .today-card.done { background: #f3fbf5; box-shadow: 0 4px 0 #d5ecdd; }
  .today-title { font-family: 'Jua', sans-serif; font-size: 15px; color: #ff8fab; }
  .today-card.done .today-title { color: #5f9a76; }
  .today-sub { font-size: 13px; color: #a08b7a; }

  /* ---------- 도감 ---------- */
  .book-head { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
  .book-head h2 { font-family: 'Jua', sans-serif; color: #6a9c78; font-size: 19px; margin: 0; }
  #count { font-size: 13px; color: #8fae95; margin-left: 8px; }
  #settingsBtn {
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: #fffdf8; box-shadow: 0 3px 0 #e9e2d0; font-size: 17px; cursor: pointer;
  }
  .progress-track {
    height: 10px; background: #e7f2ea; border-radius: 999px; overflow: hidden; margin-top: 8px;
  }
  #collectBar {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #b7e4c7, #7fc99a);
    transition: width .5s cubic-bezier(.34,1.4,.64,1);
  }

  #book { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .card {
    position: relative; background: #fffdf8; border: 2px solid transparent; border-radius: 16px;
    padding: 8px; text-align: center; box-shadow: 0 3px 0 #e9e2d0;
    font-family: 'Gaegu', sans-serif; font-size: 12px; color: #5b4636;
    min-width: 0; cursor: pointer; animation: pop .25s ease;
  }
  .card:active { transform: translateY(2px); box-shadow: 0 1px 0 #e9e2d0; }
  /* 스티커는 잘리면 안 되니 cover 가 아니라 contain */
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 12px; background: #fff; }
  .card .name { margin-top: 4px; font-family: 'Jua', sans-serif; font-size: 13px; color: #6a4c93; }
  .card .stars { color: #ffc44d; font-size: 11px; letter-spacing: -1px; }
  .card .meta { color: #a08b7a; font-size: 11px; }
  .card-badge {
    position: absolute; top: 2px; right: 2px; z-index: 1;
    background: #ff6f91; color: #fff; border-radius: 999px;
    padding: 1px 7px; font-size: 10px; font-family: 'Jua', sans-serif;
  }
  .card.locked {
    background: #fdfbf5; border: 2px dashed #dcd3c3;
    box-shadow: none; color: #cfc4ae; cursor: default;
  }
  .card.locked .qmark {
    width: 100%; aspect-ratio: 1; border-radius: 12px; background: #f6f1e6;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; font-size: 26px;
  }
  .card.locked .name { color: #cfc4ae; font-size: 12px; }
  .card.locked .stars { color: #ece4d6; }

  /* ---------- 모달 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(91,70,54,.45);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal-card {
    width: 100%; max-width: 340px; max-height: 88vh; overflow-y: auto;
    background: #fffdf8; border-radius: 24px; padding: 20px 18px;
    text-align: center; box-shadow: 0 8px 0 #e9d7c8;
    animation: pop .28s ease;
  }
  .disc-head { font-family: 'Jua', sans-serif; font-size: 18px; color: #ff6f91; margin: 0 0 10px; }
  .discovery.is-new .disc-head { animation: twinkle 1s ease-in-out infinite; }
  .disc-img {
    width: 62%; margin: 0 auto; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .discovery .disc-img { animation: reveal .45s cubic-bezier(.34,1.5,.64,1); }
  @keyframes reveal { 0%{transform:scale(.4) rotate(-8deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
  .disc-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .disc-name { font-family: 'Jua', sans-serif; font-size: 20px; color: #6a4c93; margin: 8px 0 4px; }
  .stars { color: #ffc44d; }
  .stars.big { font-size: 18px; letter-spacing: 1px; }
  .rarity-label { font-family: 'Gaegu', sans-serif; font-size: 13px; color: #a08b7a; }
  .disc-msg { font-size: 14px; color: #8a7663; margin: 8px 0 12px; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .stat-row > div {
    flex: 1; background: #f7f3ea; border-radius: 14px; padding: 8px 4px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-row b { font-family: 'Jua', sans-serif; font-size: 15px; color: #6a4c93; }
  .stat-row span { font-size: 12px; color: #a08b7a; }

  .shots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 2px; }
  .shot { position: relative; width: 62px; }
  .shot img {
    width: 62px; height: 62px; object-fit: contain; background: #fff;
    border-radius: 12px; border: 2px solid #f0e6d2; cursor: pointer;
  }
  .shot.rep img { border-color: #ff9eb9; }
  .shot-del {
    position: absolute; top: -4px; right: -4px; width: 22px; height: 22px;
    border: none; border-radius: 50%; background: #f4efe6; color: #8a7663;
    font-size: 11px; line-height: 1; cursor: pointer;
  }
  .shots-hint { font-size: 12px; color: #a08b7a; margin: 2px 0 10px; }

  #pickSearch {
    font-family: 'Gaegu', sans-serif; font-size: 15px; text-align: center; color: #6a4c93;
    border: 2px solid #ffd6e4; border-radius: 999px; padding: 10px 14px;
    width: 100%; min-height: 44px; margin-bottom: 8px; background: #fff;
  }
  #pickList {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-height: 46vh; overflow-y: auto; margin-bottom: 8px;
  }
  #pickList .chip { min-height: 38px; font-size: 13px; padding: 0 12px; }

  .checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%),
      linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    border-radius: 16px; padding: 8px; margin-bottom: 8px;
  }
  .checker img, .checker canvas { display: block; width: 100%; height: auto; }
  #decoText {
    font-family: 'Jua', sans-serif; font-size: 15px; text-align: center; color: #6a4c93;
    border: 2px solid #ffd6e4; border-radius: 999px; padding: 10px 14px;
    width: 100%; min-height: 44px; margin-bottom: 8px; background: #fff;
  }
  #decoChips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
</style>
</head>
<body>
<h1>🐾 동물 스티커 도감</h1>
<p class="subtitle">사진 속 동물을 찾아서 나만의 도감을 완성해 보세요!</p>

<div class="camera-card">
  <p id="status">준비 중...</p>
  <div id="progressWrap" hidden><div id="progressBar"></div></div>

  <label class="shutter-label" for="fileInput">📸 사진 찍기</label>
  <input type="file" accept="image/*" capture="environment" id="fileInput">
  <input type="file" accept="image/*" id="pickInput">
  <button type="button" id="pickBtn">카메라가 안 되면 앨범에서 선택하기</button>

  <img id="preview" alt="찍은 사진 미리보기" hidden>
  <div id="result"></div>

  <div id="confirmArea" hidden>
    <div id="altChips"></div>
    <button type="button" class="btn-pink" id="convertBtn" hidden>🎨 스티커로 변환</button>
    <button type="button" id="toggleOriginal" hidden>🖼️ 원본 사진으로 저장</button>
    <input id="nameInput" type="text" placeholder="이름 확인/수정">
    <button type="button" id="pickerBtn">🔍 목록에서 직접 고르기</button>
    <button type="button" class="btn-green" id="saveBtn">📌 도감에 추가</button>
  </div>

  <div id="notFound" hidden></div>
</div>

<div class="today-card" id="todayCard"></div>

<div class="book-head">
  <div><h2 style="display:inline">📖 도감</h2><span id="count"></span></div>
  <button type="button" id="settingsBtn" aria-label="설정">⚙️</button>
</div>
<div class="progress-track"><div id="collectBar"></div></div>
<div id="book"></div>

<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>

<!-- @imgly/background-removal 이 내부에서 onnxruntime-web 을 import 한다. 모듈 로드보다 먼저 선언돼야 한다. -->
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.mjs",
  "onnxruntime-web/webgpu": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.webgpu.min.mjs"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
